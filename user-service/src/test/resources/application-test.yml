spring:
  datasource:
    url: jdbc:h2:mem:userdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
  flyway:
    enabled: false

eureka:
  client:
    enabled: false

app:
  jwt:
    secret: test-only-secret-key-that-is-at-least-32-bytes-long
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7
    issuer: http://localhost:8081
  cors:
    allowed-origins: http://localhost:3000
