spring:
  datasource:
    url: jdbc:h2:mem:productdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
  flyway:
    enabled: false
  elasticsearch:
    uris: http://localhost:9200

eureka:
  client:
    enabled: false

app:
  jwt:
    secret: test-only-secret-key-that-is-at-least-32-bytes-long
