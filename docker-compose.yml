version: "3.8"

x-service-env: &common-service-env
  SPRING_PROFILES_ACTIVE: docker
  DB_HOST: mysql
  DB_PORT: 3306
  DB_USERNAME: root
  DB_PASSWORD: root
  JWT_SECRET: ${JWT_SECRET:-change-this-dev-only-secret-must-be-at-least-32-bytes-long}
  EUREKA_URI: http://service-registry:8761/eureka
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "8025:8025" # web UI to see sent emails
      - "1025:1025"

  service-registry:
    build:
      context: .
      dockerfile: service-registry/Dockerfile
    ports:
      - "8761:8761"

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    depends_on:
      - service-registry
    ports:
      - "8080:8080"
    environment:
      EUREKA_URI: http://service-registry:8761/eureka

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_started
    environment:
      <<: *common-service-env
      DB_NAME: userdb

  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      service-registry:
        condition: service_started
    environment:
      <<: *common-service-env
      DB_NAME: productdb
      ELASTICSEARCH_URIS: http://elasticsearch:9200

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      service-registry:
        condition: service_started
    environment:
      <<: *common-service-env
      DB_NAME: orderdb

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      service-registry:
        condition: service_started
    environment:
      <<: *common-service-env
      DB_NAME: paymentdb
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_placeholder}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-placeholder_secret}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-placeholder_webhook_secret}

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    depends_on:
      kafka:
        condition: service_started
      service-registry:
        condition: service_started
      mailhog:
        condition: service_started
    environment:
      EUREKA_URI: http://service-registry:8761/eureka
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MAIL_HOST: mailhog
      MAIL_PORT: 1025

volumes:
  mysql-data:
  es-data:
